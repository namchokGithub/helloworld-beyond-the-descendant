#Island size and spacing / 岛屿大小与间距
[islands]
	#Smallest island radius (blocks). / 最小岛半径（格）。
	#Default: 80
	minRadius = 80
	#Largest island radius (blocks). / 最大岛半径（格）。
	#The grid cell size is derived from this, and the minimum gap is guaranteed against it.
	#格边长按这个值推算；最小间距的几何保证也是按它算的。
	#320 is already the practical ceiling: an island's body grows with its radius, and past
	#that the bottom hits the world floor and gets cut flat (radius 320 on height layer 96
	#already flattens slightly) - beyond it, it stops reading as an island.
	#320 已是实际上限：岛体会随半径变厚，再大底部就会触到世界底而被削平
	#（半径 320 + 高度层 96 已经会轻微削平），再大就不像岛了。
	#Default: 320
	# Default: 320
	# Range: 64 ~ 320
	maxRadius = 320
	#Minimum gap between two islands (blocks). / 岛间最小间距（格）。
	#Default: 256
	# Default: 256
	# Range: 64 ~ 768
	gapMin = 256
	#Maximum gap between two islands (blocks). / 岛间最大间距（格）。
	#Default: 512
	# Default: 512
	# Range: 64 ~ 1024
	gapMax = 512
	#Y levels islands are centred on / 岛屿中心所在的高度层。
	#The default stays low on purpose: islands need headroom below the build limit (their top
	#reaches centre + ~14 blocks; the code additionally clamps it 8 blocks under the limit, so
	#nothing can be written out of bounds). Higher layers are allowed up to 256, and going
	#past that is the config's own problem.
	#默认值刻意压低：岛顶会到 中心+约14 格，需要给建筑上限留余量（代码另外会把顶部钳在
	#上限下方 8 格，保证不会写出界）。允许调到 256；再往上就是配置自己的问题了。
	#Default: [96, 112, 128]
	heightLayers = [96, 112, 128]
	#How long an island may get along its major axis / 椭圆最大长宽比。
	#Default: 2.2
	# Default: 2.2
	# Range: 1.0 ~ 3.0
	maxStretch = 2.2

#Caves and surface / 矿洞与地表
[caves]
	#One in N islands keeps vanilla's water in its caves (water-filled island);
	#every other island is carved dry. 1 = every island, 100 = 1 in 100.
	#每 N 座岛里有一座保留原版含水洞穴（水淹岛），其余为干洞。1 = 全部含水，100 = 百分之一。
	#Default: 10 (= 10%)
	wetIslandChance = 10
	#Water table used while carving dry islands (lava stays below -54).
	#干岛雕刻时使用的水位（-54 以下仍是岩浆）。
	#Default: -54
	carverWaterTable = -54
	#Force every island dry, including the ones that would otherwise keep water (for players who want a completely dry world).
	#强制所有岛都是干洞，连本该保留水的水淹岛也不例外（想要一个完全干燥世界的玩家可以打开）。
	#Default: false
	forceAllDry = false
	#Least solid rock kept under a bowl island's basin floor (blocks).
	#Used when the basin is cut, so a deep basin cannot break through its own floor; the
	#floor is not refilled after carving - the rim is what keeps the water in.
	#碗形岛盆底下方至少保留的实心岩层（格）：用于挖盆时防止盆底穿透自身；雕刻之后不再回填
	#盆底，挡水靠碗沿。
	#Default: 16
	bowlShellMin = 16
	#Headroom kept under the build limit when an island's own height would
	#reach it (blocks). / 岛体过高时，距建筑上限保留的余量（格）。
	#Default: 8
	topMargin = 8
	#Headroom kept above the world floor when an island's own depth would
	#reach it (blocks). Raise it to keep islands clear of the bottom of the world.
	#岛体过深时，距世界底部保留的余量（格）。调大可以让岛底离世界底更远。
	#Default: 8
	bottomMargin = 8
	#Multiplier on how far an island reaches down from its centre. / 岛体自中心向下的深度乘数。
	#1.0 = the shipped shape (roughly 120-226 blocks from top to bottom at radius 80-320).
	#Raise it to fit larger underground structures inside an island; volume grows linearly with
	#it, so generation costs more and large islands reach the world floor and get cut flat
	#sooner. Lower it for lighter generation and thinner islands (more structures are then
	#skipped for not fitting). Only the downward half is scaled - the top stays put, so an
	#island keeps its clearance from the build limit either way.
	#1.0 = 默认形状（半径 80~320 时上下合计约 120~226 格）。调大可以让更大的地下结构装进岛里，
	#但岛体体积线性增长 ⇒ 生成更慢、大岛更早触到世界底而被削平；调小则更轻更薄（会有更多结构
	#因为装不下而被跳过）。只缩放向下的那一半，顶部不动，所以顶部余量不受影响。
	#属于世界生成设置：已生成的世界保持创建时的取值。
	#Default: 1.0
	# Default: 1.0
	# Range: 0.3 ~ 2.0
	thicknessScale = 1.0
	#Air repair covers this much of the island's outer radius (0..1).
	#边缘补洞覆盖的外圈比例（0~1）。
	#Default: 0.8
	# Default: 0.8
	# Range: 0.0 ~ 1.0
	repairRimFrom = 0.8

#Structures / 结构
[structures]
	#Clearance between a structure's lowest block and the island's
	#underside (blocks). / 结构最低点与岛底之间要求的最小间隙（格）。
	#Default: 4
	undersideMargin = 4
	#Extra margin a structure's bounding box must keep from the island rim
	#(blocks). 0 = a structure may touch the rim.
	#Raise it to stop structures from hugging the edge;
	#the cost is that more of them are skipped. / 结构包围盒距岛沿要求额外留出的余量（格）。
	#0 = 允许贴沿；调大可以避免结构贴边，代价是被跳过的结构变多。
	#Default: 0
	rimMargin = 0
	#Extra space reserved above the default band for structures (blocks).
	#0 by default: the default height layers already stop at 128, so everything above them is
	#free for structures and an island only keeps topMargin clear of the build limit.
	#Raise it only if a pack's structures need more room than that - it lowers every island.
	#在**默认高度带之上**额外为结构预留的空间（格）。默认 0：默认层最高 128，上方本来就全是
	#给结构的，岛只要和建筑上限保持 topMargin 的距离即可。只有整合包的结构确实更高时才调大
	#（它会把所有岛压低）。
	#Default: 0
	headroom = 0

#Biome pool / 群系池
#Blunt switch first, precise lists as the fallback / 先一刀切，再用精确名单兜底
[biomes]
	#Accept biomes from other mods at all (blunt switch).
	#是否接受其它模组的群系（一刀切开关）。
	#Default: true
	allowModBiomes = true
	#Whole namespaces to skip, e.g. ["compactmachines"].
	#整体跳过的命名空间，例如 ["compactmachines"]。
	#Default: ["compactmachines"]
	namespaceBlacklist = ["compactmachines"]
	#Single biomes to skip, e.g. ["allthemodium:the_beyond"].
	#单独跳过的群系，例如 ["allthemodium:the_beyond"]。
	#Default: useless_mod:useless_biome, allthemodium:the_beyond, ae2:spatial_storage
	biomeBlacklist = ["useless_mod:useless_biome", "allthemodium:the_beyond", "ae2:spatial_storage"]
	#Biomes to force back in, whatever any list or heuristic says
	#(checked before the blacklists; use it to rescue a biome that was dropped).
	#强制放回的群系（在名单之前判定；用来把被误杀的群系救回来）。
	#Default: []
	biomeAllowlist = []
	#Id keywords of functional biomes (matched on the whole path or after
	#an underscore, and only when the biome lists no feature). / 功能性群系的 id 关键字（整段匹配或
	#下划线后缀匹配，且仅在该群系没有任何地物时才生效）。
	#Default: ["orbit"]
	functionalKeywords = ["orbit"]
	#Skip every biome without a placed feature (very blunt, off by
	#default - mod dimension biomes can be featureless yet real). / 跳过所有没有地物的群系（很粗暴，
	#默认关闭——模组维度群系可能没有地物但仍然是真实地貌）。
	#Default: false
	excludeFeaturelessBiomes = false
	#Skip biomes that look purely functional (no features, no dimension
	#tag). / 跳过看起来纯功能性的群系（无地物、无维度标签）。
	#Default: false
	excludeFunctionalBiomes = false
	#Log the biome pool decisions at server start (diagnostics).
	#启动时输出群系池的判定日志（诊断用）。
	#This is for us, not for players: turn it on when you are asked to, or when you are
	#chasing a biome that did not show up. / 这是我们自己排查用的，玩家不需要：被要求提供日志时、
	#或者正在追某个没出现的群系时再打开。
	#Default: false
	logPool = false
	#Log the island layout dump at server start (diagnostics: gaps, radius spread,
	#per-biome nearest island). / 启动时输出岛屿布局 dump（诊断用：间距/半径分布/每群系最近岛）。
	#Also for us only - it is long, and it answers questions a player never asks.
	#同样只给我们自己看：内容很长，回答的都是玩家不会问的问题。
	#Default: false
	logLayout = false
